[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-engine"
version = "0.1.0"
description = "Cognitive Reasoning Graph Engine — A provably uncertainty-bounded pipeline for argument extraction and formal verification"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "torch>=2.0",
    "transformers>=4.30",
    "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
cognitive-engine = "cognitive_engine.cli:main"

[tool.setuptools.package-data]
cognitive_engine = ["default_priors.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
