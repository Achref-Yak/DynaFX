[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-engine"
version = "0.1.0"
description = "Cognitive Reasoning Graph Engine — A provably uncertainty-bounded pipeline for argument extraction and formal verification"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.1.0",
    "litellm>=1.60.0",
    "networkx>=3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[project.scripts]
cognitive-engine = "cognitive_engine.cli:main"

[tool.setuptools.package-data]
cognitive_engine = ["default_priors.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
