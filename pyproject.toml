[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynafx"
version = "0.2.0"
description = "Multi-paradigm system dynamics framework (SD + ABM + DES) with an RDF/OWL/SPARQL knowledge engine and a KB-simulation bridge"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = [
    "system-dynamics", "agent-based-modeling", "discrete-event-simulation",
    "vensim", "rdf", "owl", "sparql", "knowledge-graph", "multi-paradigm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.1",
    "mypy>=1.15",
    "pyright>=1.1",
    "pre-commit>=3.0",
]
viz = [
    "matplotlib>=3.7",
    "plotly>=5.0",
]
docs = [
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-git-revision-date-localized-plugin>=1.0",
]
all = [
    "dynafx[dev,viz,docs]",
]

[project.urls]
Homepage = "https://github.com/Achref-Yak/DynaFX"
Repository = "https://github.com/Achref-Yak/DynaFX"
Documentation = "https://github.com/Achref-Yak/DynaFX#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "C4", "B", "RUF"]
ignore = [
    "E501",  # line too long — ~100 is fine for DSL/SPARQL expressions
    "E741",  # ambiguous variable name — `l` is idiomatic in DES
    "F811",  # redefinition — serialization methods duplicated in models.py (legacy)
    "N801", "N802", "N803", "N806",  # allow CamelCase/non-PEP8 in DSL models
    "N815", "N816",  # allow mixedCase vars in SD equations
    "N999",  # non-module packages (__init__.py)
    "RUF001", "RUF002",  # ambiguous × in docstrings — intentional (math notation)
    "UP007",  # Optional[X] → X | None (requires `from __future__ import annotations`)
    "UP038",  # isinstance(X, (A, B)) → isinstance(X, A | B) (same issue)
]
# UP007/UP038 deferred: many files lack `from __future__ import annotations`;

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src/dynafx"]
exclude = ["**/__pycache__", "**/.venv"]

# Suppress noisy-but-safe patterns in this dynamic/eval-heavy codebase.
# All are false positives at runtime — patterns like `.get()` returning
# None are safe, and dynamic attributes on dataclasses are resolved at
# runtime.
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalCall = false
reportOptionalIterable = false
reportPrivateImportUsage = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportOperatorIssue = false
reportUndefinedVariable = false
reportIndexIssue = false
reportReturnType = false
reportArgumentType = false
reportRedeclaration = false
reportMissingImports = false
reportUnsupportedDunderAll = false
