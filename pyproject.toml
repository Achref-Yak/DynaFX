[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynafx"
version = "0.2.0"
description = "Multi-paradigm system dynamics framework (SD + ABM + DES) with RDF/OWL/SPARQL cognitive reasoning engine and SL confidence grading"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = [
    "system-dynamics", "agent-based-modeling", "discrete-event-simulation",
    "vensim", "rdf", "owl", "sparql", "subjective-logic",
    "knowledge-graph", "argumentation", "multi-paradigm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Simulation",
]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz = [
    "matplotlib>=3.7",
]
all = [
    "dynafx[dev,viz]",
]

[project.urls]
Homepage = "https://github.com/Achref-Yak/reasoning_engine"
Repository = "https://github.com/Achref-Yak/reasoning_engine"
Documentation = "https://github.com/Achref-Yak/reasoning_engine#readme"

[project.scripts]
dynafx = "dynafx.system.__main__:main"

[tool.setuptools.package-data]
dynafx = ["default_priors.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src/dynafx"]
exclude = ["**/__pycache__", "**/.venv"]

# Suppress noisy-but-safe patterns in this dynamic/eval-heavy codebase.
# All are false positives at runtime — Opinion is a tuple alias, patterns
# like `.get()` returning None are safe, and dynamic attributes on dataclasses
# are resolved at runtime.
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalCall = false
reportOptionalIterable = false
reportPrivateImportUsage = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportOperatorIssue = false
reportUndefinedVariable = false
reportIndexIssue = false
reportReturnType = false
reportArgumentType = false
reportRedeclaration = false
reportMissingImports = false
reportUnsupportedDunderAll = false
