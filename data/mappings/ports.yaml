prefixes:
  epc: "http://epc.org/"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
csv: "epc_ports.csv"
target_graph: "http://epc.org/graphs/logistics"
entity:
  class: "epc:Port"
  id_column: "id"
  id_prefix: "epc:"
columns:
  name:
    predicate: "epc:name"
    type: string
  region:
    predicate: "epc:region"
    type: string
  country:
    predicate: "epc:country"
    type: string
  capacity_per_day:
    predicate: "epc:capacityPerDay"
    type: integer
  is_chokepoint:
    predicate: "epc:isChokepoint"
    type: boolean
