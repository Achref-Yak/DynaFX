site_name: DynaFX
site_description: Multi-paradigm system dynamics framework (SD + ABM + DES) with an RDF/OWL/SPARQL knowledge engine and a KB-simulation bridge
repo_url: https://github.com/Achref-Yak/DynaFX
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Knowledge Base: knowledge.md
  - Digital Twin: digital-twin.md
  - Examples: examples.md
  - Development: development.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
plugins:
  - search
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
