site_name: Cognitive Reasoning Graph Engine
site_description: A provably uncertainty-bounded pipeline for extracting structured reasoning graphs from text
repo_url: https://github.com/Achref-Yak/reasoning_engine
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Pipeline: pipeline.md
  - CLI Reference: cli.md
  - Data Models: models.md
  - Configuration: configuration.md
  - Formal Theory: theory.md
  - Development: development.md
  - Legacy:
      - Tutorial: tutorial.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
plugins:
  - search
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
