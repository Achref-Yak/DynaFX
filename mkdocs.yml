site_name: DynaFX
site_description: Multi-paradigm simulation framework (SD + ABM + DES) with a semantic knowledge engine — RDF/OWL/SPARQL knowledge graphs and closed-loop KB↔simulation reasoning for decision support
repo_url: https://github.com/Achref-Yak/DynaFX
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - Scientific Foundations: foundations.md
  - Open Research Problems: open-problems.md
  - Citation: citation.md
  - API Reference:
      - Overview: api/index.md
      - Dynamics:
          - Overview: api/dynamics/index.md
          - SysdModel: api/dynamics/SysdModel.md
          - SysdModelResult: api/dynamics/SysdModelResult.md
          - parse_sysd: api/dynamics/parse_sysd.md
          - StockDef: api/dynamics/StockDef.md
          - FlowDef: api/dynamics/FlowDef.md
          - AuxDef: api/dynamics/AuxDef.md
          - AgentDef: api/dynamics/AgentDef.md
          - DESEngine: api/dynamics/DESEngine.md
          - Causal Analysis: api/dynamics/causal.md
          - Scenario Comparison: api/dynamics/scenario.md
          - Sensitivity Analysis: api/dynamics/sensitivity.md
          - Optimization: api/dynamics/optimization.md
          - Unit Checking: api/dynamics/units.md
      - Knowledge:
          - Overview: api/knowledge/index.md
          - TripleStore: api/knowledge/TripleStore.md
          - NamedNode / Literal: api/knowledge/NamedNode.md
          - Triple / TriplePattern: api/knowledge/Triple.md
          - SPARQL: api/knowledge/sparql.md
          - Turtle: api/knowledge/turtle.md
          - Inference: api/knowledge/inference.md
          - Production Rules: api/knowledge/production.md
          - CSV Ingestion: api/knowledge/ingest_csv.md
          - Type Hierarchy: api/knowledge/hierarchy.md
      - Bridge:
          - Overview: api/bridge/index.md
          - KBSimBridge: api/bridge/KBSimBridge.md
          - ClosedLoopReasoner: api/bridge/ClosedLoopReasoner.md
          - CognitiveOrchestrator: api/bridge/CognitiveOrchestrator.md
      - Patterns:
          - Overview: api/patterns/index.md
          - SignalChain: api/patterns/SignalChain.md
          - DisruptionCascade: api/patterns/DisruptionCascade.md
  - Tutorials:
      - Tutorials: tutorials/index.md
      - 1. Hello World: tutorials/01-hello-world.md
      - 2. System Dynamics: tutorials/02-system-dynamics.md
      - 3. Agent-Based Modeling: tutorials/03-agent-based-modeling.md
      - 4. Discrete-Event Simulation: tutorials/04-discrete-event-simulation.md
      - 5. Knowledge Graphs: tutorials/05-knowledge-graph.md
      - 6. Semantic Queries: tutorials/06-semantic-queries.md
      - 7. Closed-Loop Simulation: tutorials/07-closed-loop-simulation.md
      - 8. Scenarios & Sensitivity: tutorials/08-scenarios-and-sensitivity.md
      - 9. Custom Ontology: tutorials/09-custom-ontology.md
      - 10. Publishing Results: tutorials/10-publishing-results.md
  - Knowledge Base: knowledge.md
  - Case Study: case-study-solar-epc.md
  - Examples: examples.md
  - Development: development.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
plugins:
  - search
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
